# Only needed if you deploy with the Wrangler CLI (npx wrangler pages deploy .)
# If you deploy from Git or the dashboard, add the D1 binding in
# Pages > your project > Settings > Bindings instead (Variable name: DB).
name = "theimagelabs"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "tils-db"
database_id = "6514a64b-02f6-4d53-80b5-05e3bf9ec842"
